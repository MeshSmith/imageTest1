name: Build PiMesh pyMC_Repeater Image (arm64)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install pi-gen dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            coreutils quilt parted qemu-user-static debootstrap zerofree zip \
            dosfstools libarchive-tools arch-test rsync xz-utils curl git ca-certificates \
            binfmt-support

      - name: Clone pi-gen (arm64 branch)
        run: |
          git clone --depth=1 --branch arm64 https://github.com/RPi-Distro/pi-gen.git
          cp config pi-gen/config
          cp -r stage-meshsmith pi-gen/

      - name: Build image
        run: |
          cd pi-gen
          sudo ./build.sh

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: pimesh-pymc-repeater-arm64-image
          path: pi-gen/deploy/*
